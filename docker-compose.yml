version: "3.8"

# ============================================================
# Selenium Grid 4 — Hub + Chrome + Firefox nodes
# Usage: docker-compose up -d
#        Then run: mvn test -Denv=staging (remote=true in staging.yaml)
# ============================================================

services:

  selenium-hub:
    image: selenium/hub:4.18.1
    container_name: selenium-hub
    ports:
      - "4442:4442"   # Event bus publish
      - "4443:4443"   # Event bus subscribe
      - "4444:4444"   # Grid UI + WebDriver endpoint
    environment:
      - GRID_MAX_SESSION=10
      - GRID_BROWSER_TIMEOUT=300
      - GRID_TIMEOUT=300
    networks:
      - selenium-grid

  chrome-node:
    image: selenium/node-chrome:4.18.1
    container_name: chrome-node
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_SESSION_TIMEOUT=300
      - START_XVFB=false
    volumes:
      - /dev/shm:/dev/shm
    networks:
      - selenium-grid

  firefox-node:
    image: selenium/node-firefox:4.18.1
    container_name: firefox-node
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_SESSION_TIMEOUT=300
      - START_XVFB=false
    volumes:
      - /dev/shm:/dev/shm
    networks:
      - selenium-grid

  # Optional: Video recording
  chrome-video:
    image: selenium/video:ffmpeg-6.1.1-20240402
    container_name: chrome-video
    depends_on:
      - chrome-node
    environment:
      - DISPLAY_CONTAINER_NAME=chrome-node
      - FILE_NAME=chrome-recording.mp4
    volumes:
      - ./recordings:/videos
    networks:
      - selenium-grid

networks:
  selenium-grid:
    driver: bridge
