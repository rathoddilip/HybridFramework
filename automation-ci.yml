name: Automation Framework CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run regression every day at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: [ dev, staging, prod ]
      browser:
        description: 'Browser'
        required: true
        default: 'chrome'
        type: choice
        options: [ chrome, firefox, edge ]

env:
  JAVA_VERSION: '25'
  ENV: ${{ github.event.inputs.environment || 'staging' }}

jobs:

  # ── API Tests (no browser needed) ───────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run API Tests
        run: |
          mvn test -Denv=${{ env.ENV }} \
                   -Dgroups=api \
                   -Dsurefire.suiteXmlFiles=testng.xml \
                   --no-transfer-progress

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-api-results
          path: target/allure-results

  # ── Web + Hybrid Tests (requires Selenium Grid) ─────────────────────────────
  web-hybrid-tests:
    name: Web + Hybrid Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Start Selenium Grid
        run: |
          docker-compose up -d selenium-hub chrome-node firefox-node
          echo "Waiting for Grid to be ready..."
          sleep 15
          curl -f http://localhost:4444/wd/hub/status || exit 1

      - name: Run Web + Hybrid Tests
        run: |
          mvn test -Denv=${{ env.ENV }} \
                   -Dgroups=web,hybrid \
                   -Dsurefire.suiteXmlFiles=testng.xml \
                   --no-transfer-progress

      - name: Stop Selenium Grid
        if: always()
        run: docker-compose down

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-web-results
          path: target/allure-results

  # ── Allure Report ────────────────────────────────────────────────────────────
  allure-report:
    name: Publish Allure Report
    needs: [ api-tests, web-hybrid-tests ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download API Results
        uses: actions/download-artifact@v4
        with:
          name: allure-api-results
          path: target/allure-results

      - name: Download Web Results
        uses: actions/download-artifact@v4
        with:
          name: allure-web-results
          path: target/allure-results

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Notify Slack on Failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ Automation tests failed on `${{ env.ENV }}`'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
